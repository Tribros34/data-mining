<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 950 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .sup  { fill:#e3eefb; stroke:#2f6db5; stroke-width:1.6; }
      .uns  { fill:#fdeedd; stroke:#c46a12; stroke-width:1.6; }
      .app  { fill:#f4f4f4; stroke:#777; stroke-width:1.2; stroke-dasharray:5 3; }
      .stu  { fill:#e9f6ea; stroke:#2e8b3a; stroke-width:1.6; }
      .new  { stroke-width:2.6; }
      .t    { font-size:12px; font-weight:bold; fill:#1a1a1a; text-anchor:middle; }
      .s    { font-size:10px; fill:#333; text-anchor:middle; }
      .y    { font-size:10px; fill:#2f6db5; font-weight:bold; text-anchor:middle; font-family:Menlo, Consolas, monospace; }
      .yn   { font-size:10px; fill:#c46a12; font-weight:bold; text-anchor:middle; font-family:Menlo, Consolas, monospace; }
      .m    { font-size:11px; font-weight:bold; fill:#555; text-anchor:middle; letter-spacing:1px; }
      .l    { font-size:9.5px; fill:#555; font-style:italic; }
      .ln   { stroke:#444; stroke-width:1.3; fill:none; marker-end:url(#arrow); }
      .lp   { stroke:#2e8b3a; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <!-- ============ Student and modalities ============ -->
  <rect class="stu" x="280" y="8" width="360" height="42" rx="8"/>
  <text class="t" x="460" y="26">STUDENT (Can, 3rd grade · Ela, 1st grade)</text>
  <text class="s" x="460" y="41">tablet app "Math Buddy": chat, finger writing, voice, front camera</text>

  <text class="m" x="160" y="74">TEXT</text>
  <text class="m" x="460" y="74">VISUAL</text>
  <text class="m" x="760" y="74">AUDIO</text>
  <line x1="25" y1="80" x2="295" y2="80" stroke="#bbb"/>
  <line x1="325" y1="80" x2="595" y2="80" stroke="#bbb"/>
  <line x1="625" y1="80" x2="895" y2="80" stroke="#bbb"/>
  <path class="ln" d="M330,50 L170,84"/>
  <path class="ln" d="M500,50 L470,84"/>
  <path class="ln" d="M600,50 L750,84"/>

  <!-- ============ Row 1: perception blocks (supervised) ============ -->
  <rect class="sup" x="25" y="90" width="130" height="80" rx="6"/>
  <text class="t" x="90" y="107">B1 Interest</text>
  <text class="s" x="90" y="122">chat message</text>
  <text class="s" x="90" y="135">TF-IDF + LogReg</text>
  <text class="y" x="90" y="150">y = interest</text>
  <text class="s" x="90" y="163">(+ sentiment)</text>

  <rect class="sup" x="165" y="90" width="130" height="80" rx="6"/>
  <text class="t" x="230" y="107">B2 Struggle topic</text>
  <text class="s" x="230" y="122">chat message</text>
  <text class="s" x="230" y="135">TF-IDF + LogReg</text>
  <text class="y" x="230" y="150">y = topic</text>
  <text class="s" x="230" y="163">(+ sentiment)</text>

  <rect class="sup" x="325" y="90" width="130" height="80" rx="6"/>
  <text class="t" x="390" y="107">B3 Handwriting</text>
  <text class="s" x="390" y="122">finger drawing (MNIST)</text>
  <text class="s" x="390" y="135">LogReg / Random Forest</text>
  <text class="y" x="390" y="150">y = digit</text>
  <text class="s" x="390" y="163">→ digit 0–9 + prob.</text>

  <rect class="sup" x="465" y="90" width="130" height="80" rx="6"/>
  <text class="t" x="530" y="107">B4 Attention</text>
  <text class="s" x="530" y="122">front camera</text>
  <text class="s" x="530" y="135">Random Forest</text>
  <text class="y" x="530" y="150">y = state</text>
  <text class="s" x="530" y="163">attentive/distracted/tired</text>

  <rect class="sup" x="625" y="90" width="130" height="80" rx="6"/>
  <text class="t" x="690" y="107">B5a Spoken digit</text>
  <text class="s" x="690" y="122">microphone (MFCC)</text>
  <text class="s" x="690" y="135">Logistic Regression</text>
  <text class="y" x="690" y="150">y = digit</text>
  <text class="s" x="690" y="163">→ digit 0–9 + prob.</text>

  <rect class="sup" x="765" y="90" width="130" height="80" rx="6"/>
  <text class="t" x="830" y="107">B5b Confidence</text>
  <text class="s" x="830" y="122">voice of the answer</text>
  <text class="s" x="830" y="135">Logistic Regression</text>
  <text class="y" x="830" y="150">y = state</text>
  <text class="s" x="830" y="163">confident / hesitant</text>

  <!-- ============ Row 2: tutor (program logic) ============ -->
  <rect class="app" x="25" y="228" width="420" height="62" rx="6"/>
  <text class="t" x="235" y="247">TUTOR – program logic (not a learning block)</text>
  <text class="s" x="235" y="263">word problems about the interest · reads and grades every answer</text>
  <text class="s" x="235" y="277">asks B9's follow-up probes by voice · follows the learning path</text>

  <path class="ln" d="M90,170 L90,226"/>
  <text class="l" x="94" y="205">interest</text>
  <path class="ln" d="M230,170 L230,226"/>
  <text class="l" x="234" y="205">topic, start easy</text>
  <path class="ln" d="M390,170 L390,226"/>
  <text class="l" x="394" y="205">number</text>
  <path class="ln" d="M690,170 L447,250"/>
  <text class="l" x="600" y="214">number</text>
  <!-- tutor -> student -->
  <path class="lp" d="M310,228 L310,52"/>
  <text class="l" x="305" y="222" fill="#2e8b3a" transform="rotate(-90 305 222)">question · probe · practice</text>

  <!-- ============ Row 3: B7 and B6 ============ -->
  <rect class="uns" x="25" y="335" width="250" height="70" rx="6"/>
  <text class="t" x="150" y="353">B7 Error type discovery</text>
  <text class="s" x="150" y="368">one row = one wrong answer · K-Means (k = 4)</text>
  <text class="yn" x="150" y="382">no label</text>
  <text class="s" x="150" y="396">→ carry / slip / operation / fraction rule</text>

  <rect class="sup" x="470" y="320" width="300" height="72" rx="6"/>
  <text class="t" x="620" y="338">B6 Mastery percentage over time</text>
  <text class="s" x="620" y="353">answer history + attention + hesitation history</text>
  <text class="y" x="620" y="368">LogReg (knowledge tracing) · y = is_correct</text>
  <text class="s" x="620" y="383">→ mastery % per topic, time series</text>

  <path class="ln" d="M150,290 L150,333"/>
  <text class="l" x="155" y="316">wrong answer</text>
  <path class="ln" d="M420,290 L500,318"/>
  <text class="l" x="452" y="298">graded answer</text>
  <path class="ln" d="M545,170 L590,318"/>
  <text class="l" x="575" y="250">attention</text>
  <path class="ln" d="M815,170 L740,318"/>
  <text class="l" x="784" y="250">hesitation</text>

  <!-- ============ Row 4: B10 and B9 ============ -->
  <rect class="uns new" x="25" y="450" width="235" height="78" rx="6"/>
  <text class="t" x="142" y="469">B10 Skill map discovery</text>
  <text class="s" x="142" y="484">one row = one placement test</text>
  <text class="s" x="142" y="497">association rules + transitive reduction</text>
  <text class="yn" x="142" y="511">no label</text>
  <text class="s" x="142" y="523">→ prerequisite map, teaching order</text>

  <rect class="sup new" x="300" y="450" width="330" height="80" rx="6"/>
  <text class="t" x="465" y="469">B9 Root-cause diagnosis</text>
  <text class="s" x="465" y="484">wrong answer + context + adaptive follow-up probes</text>
  <text class="s" x="465" y="497">Decision Tree (first guess) + Bayes' rule (each answer)</text>
  <text class="y" x="465" y="511">y = root_cause (12 skills + careless)</text>
  <text class="s" x="465" y="524">→ the missing skill → learning path</text>

  <!-- inputs of B9 -->
  <path class="ln" d="M275,395 L330,448"/>
  <text class="l" x="306" y="413">error type</text>
  <path class="ln" d="M560,392 L560,448"/>
  <text class="l" x="565" y="426">mastery</text>
  <path class="ln" d="M512,170 L460,300 L460,448"/>
  <text class="l" x="465" y="430">attention</text>
  <path class="ln" d="M880,170 L880,490 L632,490"/>
  <text class="l" x="760" y="484">hesitation (B5b)</text>
  <!-- tutor <-> B9 -->
  <path class="ln" d="M345,290 L355,448"/>
  <text class="l" x="342" y="322" text-anchor="end">probe answers</text>
  <path class="lp" d="M395,448 L385,292"/>
  <text class="l" x="396" y="372" fill="#2e8b3a">root cause →</text>
  <text class="l" x="396" y="383" fill="#2e8b3a">learning path</text>
  <!-- tutor <-> B10 -->
  <path class="ln" d="M25,262 L4,262 L4,470 L23,470"/>
  <path class="lp" d="M23,500 L-8,500 L-8,275 L23,275"/>
  <text class="l" x="-14" y="470" transform="rotate(-90 -14 470)">skill map (B10 → tutor)</text>
  <text class="l" x="14" y="440" transform="rotate(-90 14 440)">placement tests</text>

  <!-- ============ Row 5: B8 ============ -->
  <rect class="uns" x="470" y="580" width="300" height="66" rx="6"/>
  <text class="t" x="620" y="598">B8 Student profiles</text>
  <text class="s" x="620" y="613">one row = one student · K-Means (k = 4)</text>
  <text class="yn" x="620" y="627">no label</text>
  <text class="s" x="620" y="640">→ profile + teaching recommendation</text>

  <path class="ln" d="M745,392 L745,560 L700,560 L700,578"/>
  <text class="l" x="740" y="552" text-anchor="end">accuracy, speed, attention, voice</text>
  <path class="ln" d="M275,385 L288,385 L288,610 L468,610"/>
  <text class="l" x="296" y="604">characteristic error</text>

  <!-- B6 -> tutor (next topic, break) and B8 -> tutor (pace) -->
  <path class="lp" d="M472,334 L447,334 L447,292"/>
  <text class="l" x="466" y="347" fill="#2e8b3a" text-anchor="end">next topic,</text>
  <text class="l" x="466" y="358" fill="#2e8b3a" text-anchor="end">break (B6)</text>
  <path class="lp" d="M468,640 L280,640 L280,425 L268,425 L268,292"/>
  <text class="l" x="300" y="652" fill="#2e8b3a">pace (B8 → tutor)</text>

  <!-- ============ Row 6: dashboard ============ -->
  <rect class="app" x="25" y="690" width="870" height="56" rx="6"/>
  <text class="t" x="460" y="710">TEACHER DASHBOARD (weekly)</text>
  <text class="s" x="460" y="726">B6 mastery over time · B7 error types · B8 profile + advice · B9 root causes this week · B10 learning patterns of the class</text>
  <text class="s" x="460" y="739">→ the teacher sees not only WHAT the child got wrong, but WHY, and in which order to teach</text>

  <path class="ln" d="M142,528 L142,688"/>
  <path class="ln" d="M288,610 L288,688"/>
  <path class="ln" d="M440,530 L440,688"/>
  <path class="ln" d="M620,646 L620,688"/>
  <path class="ln" d="M760,392 L760,688"/>

  <!-- ============ Legend + learning loop ============ -->
  <rect class="sup" x="25" y="768" width="18" height="12" rx="2"/>
  <text class="l" x="48" y="778">supervised (y = label)</text>
  <rect class="uns" x="170" y="768" width="18" height="12" rx="2"/>
  <text class="l" x="193" y="778">unsupervised (no label)</text>
  <rect class="app" x="320" y="768" width="18" height="12" rx="2"/>
  <text class="l" x="343" y="778">program logic</text>
  <line x1="430" y1="774" x2="458" y2="774" class="lp"/>
  <text class="l" x="463" y="778">feedback (to the student / tutor)</text>
  <rect class="sup new" x="625" y="768" width="18" height="12" rx="2"/>
  <text class="l" x="648" y="778">new: B9, B10</text>
  <text class="s" x="460" y="805" font-weight="bold">Learning loop: symptom (B3/B5a, B7) → diagnosis (B9 + B4, B5b, B6) → instruction (path on B10's map, B1's interest) → measurement (B6) → again</text>
</svg>
